name: Build FFmpeg macOS LGPL

on:
  workflow_dispatch:
  workflow_call:
env:
  FFMPEG_VERSION: "9.0.2"
  INSTALL_PREFIX: "/opt/ffmpeg-lgpl"

jobs:
  build:
    name: FFmpeg arm64
    runs-on: macos-15

    steps:
      - name: System info
        run: |
          set -euxo pipefail

          uname -a
          uname -m
          sw_vers
          clang --version

      - name: Download FFmpeg
        run: |
          set -euxo pipefail

          curl -fL \
            "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz" \
            -o ffmpeg.tar.xz

          tar -xf ffmpeg.tar.xz

      - name: Configure FFmpeg
        working-directory: ffmpeg-${{ env.FFMPEG_VERSION }}
        run: |
          set -euxo pipefail

          ./configure \
            --prefix="${INSTALL_PREFIX}" \
            --enable-shared \
            --disable-static \
            --disable-gpl \
            --disable-nonfree \
            --disable-autodetect \
            --disable-doc \
            --disable-debug \
            --enable-videotoolbox \
            --enable-audiotoolbox

      - name: Build FFmpeg
        working-directory: ffmpeg-${{ env.FFMPEG_VERSION }}
        run: |
          set -euxo pipefail

          make -j"$(sysctl -n hw.ncpu)"

      - name: Install FFmpeg
        working-directory: ffmpeg-${{ env.FFMPEG_VERSION }}
        run: |
          set -euxo pipefail

          sudo rm -rf "${INSTALL_PREFIX}"
          sudo mkdir -p "${INSTALL_PREFIX}"

          sudo make install

          find "${INSTALL_PREFIX}" -maxdepth 4 -type f | sort

      - name: Verify FFmpeg runs
        run: |
          set -euxo pipefail

          "${INSTALL_PREFIX}/bin/ffmpeg" -version
          "${INSTALL_PREFIX}/bin/ffprobe" -version

      - name: Verify license configuration
        run: |
          set -euxo pipefail

          CONFIG="$("${INSTALL_PREFIX}/bin/ffmpeg" -buildconf 2>&1)"

          echo "${CONFIG}"

          if echo "${CONFIG}" | grep -q -- '--enable-gpl'; then
            echo "ERROR: FFmpeg contains --enable-gpl"
            exit 1
          fi

          if echo "${CONFIG}" | grep -q -- '--enable-nonfree'; then
            echo "ERROR: FFmpeg contains --enable-nonfree"
            exit 1
          fi

          echo "FFmpeg GPL/nonfree check passed"

      - name: Verify architecture
        run: |
          set -euxo pipefail

          file "${INSTALL_PREFIX}/bin/ffmpeg"
          file "${INSTALL_PREFIX}/lib/libavcodec.dylib"

          ARCH_FFMPEG="$(lipo -archs "${INSTALL_PREFIX}/bin/ffmpeg")"
          ARCH_AVCODEC="$(lipo -archs "${INSTALL_PREFIX}/lib/libavcodec.dylib")"

          echo "ffmpeg arch: ${ARCH_FFMPEG}"
          echo "libavcodec arch: ${ARCH_AVCODEC}"

          test "${ARCH_FFMPEG}" = "arm64"
          test "${ARCH_AVCODEC}" = "arm64"

      - name: Verify dylib dependencies
        run: |
          set -euxo pipefail

          echo "=== ffmpeg ==="
          otool -L "${INSTALL_PREFIX}/bin/ffmpeg"

          echo "=== libavcodec ==="
          otool -L "${INSTALL_PREFIX}/lib/libavcodec.dylib"

          echo "=== libavformat ==="
          otool -L "${INSTALL_PREFIX}/lib/libavformat.dylib"

          echo "=== libavutil ==="
          otool -L "${INSTALL_PREFIX}/lib/libavutil.dylib"

          echo "=== libswscale ==="
          otool -L "${INSTALL_PREFIX}/lib/libswscale.dylib"

      - name: Verify pkg-config files
        run: |
          set -euxo pipefail

          export PKG_CONFIG_PATH="${INSTALL_PREFIX}/lib/pkgconfig"

          find "${INSTALL_PREFIX}/lib/pkgconfig" \
            -type f \
            -name '*.pc' \
            -print

          pkg-config --modversion libavcodec
          pkg-config --modversion libavformat
          pkg-config --modversion libavutil
          pkg-config --modversion libswscale

          pkg-config --cflags libavcodec
          pkg-config --libs libavcodec

      - name: Write build info
        run: |
          set -euxo pipefail

          sudo tee "${INSTALL_PREFIX}/BUILD_INFO.txt" >/dev/null <<EOF
          FFmpeg version: ${FFMPEG_VERSION}
          Architecture: $(uname -m)
          macOS: $(sw_vers -productVersion)
          Install prefix: ${INSTALL_PREFIX}

          GPL: disabled
          nonfree: disabled
          shared libraries: enabled
          static libraries: disabled
          VideoToolbox: enabled
          AudioToolbox: enabled
          autodetect: disabled
          EOF

      - name: Package FFmpeg
        run: |
          set -euxo pipefail

          ARCH="$(uname -m)"
          ARCHIVE="ffmpeg-${FFMPEG_VERSION}-macos-${ARCH}-lgpl.tar.gz"

          sudo tar \
            -C / \
            -czf "${GITHUB_WORKSPACE}/${ARCHIVE}" \
            opt/ffmpeg-lgpl

          sudo chown "$(id -u):$(id -g)" \
            "${GITHUB_WORKSPACE}/${ARCHIVE}"

          (cd "${GITHUB_WORKSPACE}" && shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256")

          ls -lh \
            "${GITHUB_WORKSPACE}/${ARCHIVE}" \
            "${GITHUB_WORKSPACE}/${ARCHIVE}.sha256"

      - name: Test packaged FFmpeg
        run: |
          set -euxo pipefail

          ARCH="$(uname -m)"
          ARCHIVE="ffmpeg-${FFMPEG_VERSION}-macos-${ARCH}-lgpl.tar.gz"

          sudo rm -rf "${INSTALL_PREFIX}"

          test ! -e "${INSTALL_PREFIX}/bin/ffmpeg"

          sudo tar \
            -xzf "${GITHUB_WORKSPACE}/${ARCHIVE}" \
            -C /

          "${INSTALL_PREFIX}/bin/ffmpeg" -version
          "${INSTALL_PREFIX}/bin/ffmpeg" -buildconf

          export PKG_CONFIG_PATH="${INSTALL_PREFIX}/lib/pkgconfig"

          pkg-config --modversion libavcodec
          pkg-config --modversion libavformat

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ env.FFMPEG_VERSION }}-macos-arm64-lgpl
          path: |
            ffmpeg-${{ env.FFMPEG_VERSION }}-macos-arm64-lgpl.tar.gz
            ffmpeg-${{ env.FFMPEG_VERSION }}-macos-arm64-lgpl.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
